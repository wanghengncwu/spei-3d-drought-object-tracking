[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spei-3d-drought-object-tracking"
version = "1.0.0"
description = "Reproducible SPEI-based tracking and sensitivity analysis of 3-D meteorological drought objects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Heng Wang"},
  {name = "Fuqiang Wang"},
]
maintainers = [
  {name = "Heng Wang"},
]
keywords = [
  "drought",
  "SPEI",
  "three-dimensional objects",
  "event tracking",
  "meteorological drought",
  "reproducible research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "xarray>=2023.1",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "netCDF4>=1.6",
]

[project.optional-dependencies]
labels = [
  "dask[array]>=2023.1",
  "zarr>=2.16,<3",
  "numcodecs>=0.11",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff==0.16.1",
  "tomli>=2; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/wanghengncwu/spei-3d-drought-object-tracking"
Issues = "https://github.com/wanghengncwu/spei-3d-drought-object-tracking/issues"
Changelog = "https://github.com/wanghengncwu/spei-3d-drought-object-tracking/blob/main/CHANGELOG.md"

[project.scripts]
spei3d = "spei3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
