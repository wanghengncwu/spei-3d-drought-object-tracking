input:
  spei: ../data/cru_ts_spei06.nc
  dataset_name: CRU-TS
  variable: spei
  time_start: 1901-01
  time_end: 2024-12
  target_grid: null
  land_mask: null

output:
  root: ../outputs/cru_ts_sensitivity

event_definition:
  spei_threshold: -1.0
  connectivity: 8
  minimum_monthly_patch_area_km2: 25000
  minimum_duration_months: 3
  minimum_peak_area_km2: 50000

linking:
  rule: maximum_overlap
  minimum_overlap_cells: 1
  minimum_iou: 0.10

runtime:
  time_block_months: 12
  write_labels: false
  overwrite: false
  hash_inputs: false

sensitivity:
  baseline_scale_months: 6
  accumulation_scales: [3, 6, 12]
  scale_inputs:
    3: ../data/cru_ts_spei03.nc
    6: ../data/cru_ts_spei06.nc
    12: ../data/cru_ts_spei12.nc
  spei_thresholds: [-1.0, -1.5, -2.0]
  monthly_patch_areas_km2: [10000, 25000, 50000]
  minimum_durations_months: [1, 3, 6]
  minimum_peak_areas_km2: [25000, 50000, 100000]
  linking_rules:
    - rule: maximum_overlap
      minimum_iou: 0.0
    - rule: overlap_union
      minimum_iou: 0.0
    - rule: maximum_iou
      minimum_iou: 0.10
